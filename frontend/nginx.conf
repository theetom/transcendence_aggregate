# This file is included in Nginx's http context. Keep website routes unthrottled.
limit_req_zone $binary_remote_addr zone=public_api_clients:10m rate=10r/s;

server {
    listen 80 default_server;
    server_name ${SERVER_NAME};

    # HTTPS_PORT is the published port on the host, not container port 443.
    return 308 https://$host:${HTTPS_PORT}$request_uri;
}

server {
    listen 443 ssl default_server;
    server_name ${SERVER_NAME};

    ssl_certificate /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Up to 20 MiB of recipe photos plus multipart fields and boundaries.
    client_max_body_size 25m;

    # Resolve the Compose service again when its container address changes.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $backend_upstream backend:8000;

    # Protect external API credentials, including missing/invalid-key requests.
    location ^~ /api/public/ {
        limit_req zone=public_api_clients burst=100 nodelay;
        limit_req_status 429;
        error_page 429 = @public_api_rate_limited;

        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors off;
    }

    location @public_api_rate_limited {
        default_type application/json;
        add_header Retry-After 1 always;
        add_header Cache-Control no-store always;
        return 429 '{"detail":"Too many public API requests. Retry after one second."}';
    }

    # Both prefixes belong to the existing Django URL configuration.
    location ~ ^/(api|admin)(/|$) {
        # Keep the complete original path (including /api/) and query string.
        proxy_pass http://$backend_upstream$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Return Django's actual error status and body to the frontend.
        proxy_intercept_errors off;
    }

    # Django assets are separate from the built React /assets/ directory.
    location ^~ /static/ {
        alias /srv/django/static/;
    }

    # Uploaded photos live outside the generated React files.
    location ^~ /media/ {
        alias /srv/django/media/;
        autoindex off;
        add_header X-Content-Type-Options nosniff always;
    }

    # Missing compiled assets must not receive the React HTML document.
    location ^~ /assets/ {
        try_files $uri =404;
    }

    # React Router selects the page after the browser loads index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
